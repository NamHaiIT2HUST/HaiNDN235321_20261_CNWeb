<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ứng dụng React CRUD - Quản lý người dùng | Nguyễn Đào Nam Hải</title>
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18, ReactDOM 18, Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --primary-text: #3730a3;
      --success: #10b981;
      --success-hover: #059669;
      --success-light: #d1fae5;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-light: #fee2e2;
      --warning: #f59e0b;
      --warning-light: #fef3c7;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-card: rgba(30, 41, 59, 0.7);
      --surface-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: "";
      position: fixed;
      top: -150px;
      left: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      bottom: -150px;
      right: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Navigation Bar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--surface-border);
      padding: 0.85rem 1.5rem;
    }
    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.15rem;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .brand-text span {
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-link:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }
    .nav-link.highlight {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(59, 130, 246, 0.2));
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .nav-link.highlight:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(59, 130, 246, 0.35));
      color: #fff;
    }

    /* Container */
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      position: relative;
      z-index: 1;
      flex: 1;
    }

    /* Page Header */
    .page-header {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .page-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .page-title .badge-react {
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: rgba(97, 218, 251, 0.15);
      color: #61dafb;
      border: 1px solid rgba(97, 218, 251, 0.3);
      font-weight: 600;
      letter-spacing: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .page-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Top Control Bar */
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    /* Search Form Component */
    .search-box-wrapper {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 480px;
    }
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      pointer-events: none;
      font-size: 0.95rem;
    }
    .search-input {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 2.75rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }
    .search-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      background: rgba(30, 41, 59, 0.9);
    }
    .search-input::placeholder {
      color: var(--text-subtle);
    }
    .search-clear {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      padding: 0.3rem;
      font-size: 0.85rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .search-clear:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.7rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      font-family: inherit;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    }
    .btn-danger:hover {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--surface-border);
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .btn-sm {
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
    }
    .btn-icon {
      padding: 0.45rem;
      border-radius: var(--radius-sm);
    }

    /* Stats and Info Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text);
      font-weight: 600;
    }
    .status-count {
      background: var(--primary-light);
      color: var(--primary-text);
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .filter-tag {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    /* Result Table Container */
    .table-container {
      background: var(--surface-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      position: relative;
    }
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }
    .crud-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }
    .crud-table th {
      background: #1e293b;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--surface-border);
      white-space: nowrap;
    }
    .crud-table td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      color: var(--text);
      vertical-align: middle;
    }
    .crud-table tr:last-child td {
      border-bottom: none;
    }
    .crud-table tbody tr {
      transition: var(--transition);
    }
    .crud-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Table cells styling */
    .user-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-sm);
      display: inline-block;
      text-align: center;
      min-width: 32px;
    }
    .user-name-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .user-name {
      font-weight: 600;
      color: #f1f5f9;
    }
    .user-username {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
    }
    .user-email {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .user-address {
      color: var(--text-muted);
      max-width: 240px;
      line-height: 1.4;
      font-size: 0.88rem;
    }
    .user-phone {
      color: var(--text-muted);
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
    .action-buttons {
      display: flex;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .btn-edit {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .btn-edit:hover {
      background: #4f46e5;
      color: #fff;
      border-color: #4f46e5;
    }
    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .btn-delete:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }

    /* Loading and Empty State */
    .empty-state {
      padding: 4rem 2rem;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 3rem;
      color: var(--text-subtle);
      margin-bottom: 1rem;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top: 3px solid #6366f1;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Modal Form (Add & Edit) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 1.5rem;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-content {
      background: #1e293b;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    @keyframes slideUp {
      from { transform: translateY(20px) scale(0.97); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #f8fafc;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.35rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .modal-close:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }
    .modal-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-label .req {
      color: var(--danger);
    }
    .form-input {
      background: #0f172a;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.85rem;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }
    .form-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .form-section-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #818cf8;
      font-weight: 700;
      margin-top: 0.5rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px dashed var(--surface-border);
      grid-column: 1 / -1;
    }
    .modal-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--surface-border);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.5);
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 1000;
      pointer-events: none;
    }
    .toast {
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      background: #1e293b;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      animation: slideInRight 0.3s ease-out;
      border-left: 4px solid var(--primary);
      pointer-events: auto;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.danger { border-left-color: var(--danger); }
    .toast.info { border-left-color: #38bdf8; }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Footer */
    .app-footer {
      border-top: 1px solid var(--surface-border);
      padding: 1.5rem;
      text-align: center;
      color: var(--text-subtle);
      font-size: 0.88rem;
      background: rgba(15, 23, 42, 0.7);
    }
    .app-footer a {
      color: #818cf8;
      text-decoration: none;
    }
    .app-footer a:hover {
      text-decoration: underline;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .container {
        padding: 1.25rem 1rem 3rem;
      }
      .page-title {
        font-size: 1.5rem;
      }
      .control-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box-wrapper {
        max-width: 100%;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .status-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- Root React Mount Node -->
  <div id="root"></div>

  <!-- React Babel Script -->
  <script type="text/babel">

    // ==========================================
    // TOAST NOTIFICATION COMPONENT
    // ==========================================
    function Toast({ toast, onClose }) {
      React.useEffect(() => {
        const timer = setTimeout(() => {
          onClose(toast.id);
        }, 3200);
        return () => clearTimeout(timer);
      }, [toast, onClose]);

      const getIcon = () => {
        if (toast.type === "success") return "fa-check-circle";
        if (toast.type === "danger") return "fa-trash-alt";
        return "fa-info-circle";
      };

      return (
        <div className={`toast ${toast.type}`}>
          <i className={`fas ${getIcon()}`}></i>
          <span>{toast.message}</span>
        </div>
      );
    }

    // ==========================================
    // COMPONENT 1: SearchForm
    // Nhận prop onChangeValue từ App (State Lifting)
    // ==========================================
    function SearchForm({ onChangeValue }) {
      const [localVal, setLocalVal] = React.useState("");

      const handleInput = (e) => {
        const val = e.target.value;
        setLocalVal(val);
        onChangeValue(val);
      };

      const handleClear = () => {
        setLocalVal("");
        onChangeValue("");
      };

      return (
        <div className="search-box-wrapper">
          <i className="fas fa-search search-icon"></i>
          <input
            type="text"
            className="search-input"
            placeholder="Tìm theo name, username..."
            value={localVal}
            onChange={handleInput}
          />
          {localVal && (
            <button
              type="button"
              className="search-clear"
              title="Xóa tìm kiếm"
              onClick={handleClear}
            >
              <i className="fas fa-times"></i>
            </button>
          )}
        </div>
      );
    }

    // ==========================================
    // COMPONENT 2: AddUser
    // Nhận prop onAdd từ App (State Lifting)
    // ==========================================
    function AddUser({ onAdd }) {
      const [adding, setAdding] = React.useState(false);
      const [user, setUser] = React.useState({
        name: "",
        username: "",
        email: "",
        address: { street: "", suite: "", city: "" },
        phone: "",
        website: ""
      });

      const handleChange = (e) => {
        const { id, value } = e.target;
        if (["street", "suite", "city"].includes(id)) {
          setUser({
            ...user,
            address: { ...user.address, [id]: value }
          });
        } else {
          setUser({ ...user, [id]: value });
        }
      };

      const handleAdd = (e) => {
        if (e) e.preventDefault();
        if (!user.name.trim() || !user.username.trim()) {
          alert("Vui lòng nhập Họ tên (Name) và Tên người dùng (Username)!");
          return;
        }

        // Gửi user lên App
        onAdd(user);

        // Reset form & đóng modal
        setUser({
          name: "",
          username: "",
          email: "",
          address: { street: "", suite: "", city: "" },
          phone: "",
          website: ""
        });
        setAdding(false);
      };

      return (
        <div>
          <button
            className="btn btn-primary"
            onClick={() => setAdding(true)}
          >
            <i className="fas fa-user-plus"></i>
            Thêm người dùng mới
          </button>

          {adding && (
            <div className="modal-overlay" onClick={() => setAdding(false)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="modal-title">
                    <i className="fas fa-user-plus" style={{ color: "#818cf8" }}></i>
                    Thêm người dùng mới
                  </h3>
                  <button
                    className="modal-close"
                    onClick={() => setAdding(false)}
                    aria-label="Đóng"
                  >
                    <i className="fas fa-times"></i>
                  </button>
                </div>

                <form onSubmit={handleAdd}>
                  <div className="modal-body">
                    <div className="form-grid">
                      <div className="form-group">
                        <label className="form-label" htmlFor="name">
                          Họ và tên <span className="req">*</span>
                        </label>
                        <input
                          id="name"
                          className="form-input"
                          type="text"
                          required
                          placeholder="Ví dụ: Leanne Graham"
                          value={user.name}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="username">
                          Username <span className="req">*</span>
                        </label>
                        <input
                          id="username"
                          className="form-input"
                          type="text"
                          required
                          placeholder="Ví dụ: Bret"
                          value={user.username}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="email">Email</label>
                        <input
                          id="email"
                          className="form-input"
                          type="email"
                          placeholder="name@example.com"
                          value={user.email}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="phone">Số điện thoại</label>
                        <input
                          id="phone"
                          className="form-input"
                          type="text"
                          placeholder="1-770-736-8031"
                          value={user.phone}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-section-title">
                        <i className="fas fa-map-marker-alt" style={{ marginRight: "6px" }}></i>
                        Thông tin Địa chỉ (Lồng nhau)
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="street">Đường phố (Street)</label>
                        <input
                          id="street"
                          className="form-input"
                          type="text"
                          placeholder="Kulas Light"
                          value={user.address.street}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="suite">Căn hộ / Suite</label>
                        <input
                          id="suite"
                          className="form-input"
                          type="text"
                          placeholder="Apt. 556"
                          value={user.address.suite}
                          onChange={handleChange}
                        />
                      </div>

                      <div className="form-group full-width">
                        <label className="form-label" htmlFor="city">Thành phố (City)</label>
                        <input
                          id="city"
                          className="form-input"
                          type="text"
                          placeholder="Gwenborough"
                          value={user.address.city}
                          onChange={handleChange}
                        />
                      </div>
                    </div>
                  </div>

                  <div className="modal-footer">
                    {/* Chú ý: viết đúng () => setAdding(false) để tránh lỗi Too many re-renders */}
                    <button
                      type="button"
                      className="btn btn-secondary"
                      onClick={() => setAdding(false)}
                    >
                      Hủy bỏ
                    </button>
                    <button type="submit" className="btn btn-primary">
                      <i className="fas fa-check"></i> Lưu người dùng
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // COMPONENT 3: ResultTable
    // Nhận props: keyword, user, onAdded, onNotify
    // ==========================================
    function ResultTable({ keyword, user, onAdded, onNotify }) {
      const [users, setUsers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [editing, setEditing] = React.useState(null);
      const [deleteConfirmId, setDeleteConfirmId] = React.useState(null);

      // 1. Tải danh sách người dùng ban đầu từ API
      React.useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            if (!res.ok) throw new Error("Mạng không phản hồi tốt");
            return res.json();
          })
          .then((data) => {
            setUsers(data);
            setLoading(false);
          })
          .catch((err) => {
            console.warn("Lỗi tải API, sử dụng dữ liệu mặc định:", err);
            // Fallback dữ liệu mẫu phòng trường hợp không có mạng
            const fallbackUsers = [
              { id: 1, name: "Leanne Graham", username: "Bret", email: "Sincere@april.biz", address: { street: "Kulas Light", suite: "Apt. 556", city: "Gwenborough" }, phone: "1-770-736-8031 x56442" },
              { id: 2, name: "Ervin Howell", username: "Antonette", email: "Shanna@melissa.tv", address: { street: "Victor Plains", suite: "Suite 879", city: "Wisokyburgh" }, phone: "010-692-6593 x09125" },
              { id: 3, name: "Clementine Bauch", username: "Samantha", email: "Nathan@yesenia.net", address: { street: "Douglas Extension", suite: "Suite 847", city: "McKenziehaven" }, phone: "1-463-123-4447" },
              { id: 4, name: "Patricia Lebsack", username: "Karianne", email: "Julianne.OConner@kory.org", address: { street: "Hoeger Mall", suite: "Apt. 692", city: "South Elvis" }, phone: "493-170-9623 x156" },
              { id: 5, name: "Chelsey Dietrich", username: "Kamren", email: "Lucio_Hettinger@annie.ca", address: { street: "Skiles Walks", suite: "Suite 351", city: "Roscoeview" }, phone: "(254)954-1289" }
            ];
            setUsers(fallbackUsers);
            setLoading(false);
          });
      }, []);

      // 2. Lắng nghe khi có người dùng mới từ prop user (App truyền xuống)
      React.useEffect(() => {
        if (user) {
          // Tính toán id duy nhất an toàn (tránh va chạm key khi xóa)
          setUsers((prev) => {
            const nextId = prev.length > 0 ? Math.max(...prev.map(u => Number(u.id) || 0)) + 1 : 1;
            return [...prev, { ...user, id: nextId }];
          });
          onAdded(); // Báo cho App reset newUser về null
          if (onNotify) onNotify(`Đã thêm thành công người dùng: ${user.name}`, "success");
        }
      }, [user]);

      // 3. Xử lý mở form Sửa với kỹ thuật Deep Copy đối tượng lồng nhau
      const editUser = (u) => {
        setEditing({
          ...u,
          address: { ...(u.address || { street: "", suite: "", city: "" }) }
        });
      };

      // Xử lý thay đổi trong form Edit
      const handleEditChange = (field, value) => {
        if (["street", "suite", "city"].includes(field)) {
          setEditing({
            ...editing,
            address: { ...editing.address, [field]: value }
          });
        } else {
          setEditing({ ...editing, [field]: value });
        }
      };

      // 4. Lưu dữ liệu đã sửa bằng Array.map()
      const saveUser = (e) => {
        if (e) e.preventDefault();
        if (!editing.name.trim() || !editing.username.trim()) {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
        if (onNotify) onNotify(`Đã cập nhật thông tin: ${editing.name}`, "info");
        setEditing(null);
      };

      // 5. Xóa người dùng bằng Array.filter()
      const removeUser = (id) => {
        const deletedUser = users.find(u => u.id === id);
        setUsers((prev) => prev.filter((u) => u.id !== id));
        setDeleteConfirmId(null);
        if (onNotify) onNotify(`Đã xóa người dùng: ${deletedUser ? deletedUser.name : '#' + id}`, "danger");
      };

      // 6. Lọc danh sách theo keyword (name hoặc username)
      const kw = (keyword || "").toLowerCase().trim();
      const filteredUsers = users.filter((u) => {
        const nameMatch = (u.name || "").toLowerCase().includes(kw);
        const usernameMatch = (u.username || "").toLowerCase().includes(kw);
        return nameMatch || usernameMatch;
      });

      return (
        <div>
          {/* Status Bar */}
          <div className="status-bar">
            <div className="status-badge">
              <i className="fas fa-users" style={{ color: "#818cf8" }}></i>
              <span>Tổng số người dùng:</span>
              <span className="status-count">{users.length}</span>
            </div>
            {kw && (
              <div style={{ display: "flex", alignItems: "center", gap: "0.5rem" }}>
                <span>Đang lọc theo:</span>
                <span className="filter-tag">"{kw}"</span>
                <span style={{ fontSize: "0.82rem" }}>({filteredUsers.length} kết quả)</span>
              </div>
            )}
          </div>

          {/* Table Container */}
          <div className="table-container">
            {loading ? (
              <div className="empty-state">
                <div className="spinner"></div>
                <p>Đang tải danh sách người dùng từ API...</p>
              </div>
            ) : filteredUsers.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon"><i className="fas fa-user-slash"></i></div>
                <h4>Không tìm thấy người dùng phù hợp</h4>
                <p>Thử tìm với từ khóa khác hoặc bấm nút thêm người dùng mới.</p>
              </div>
            ) : (
              <div className="table-responsive">
                <table className="crud-table">
                  <thead>
                    <tr>
                      <th style={{ width: "70px", textAlign: "center" }}>ID</th>
                      <th>Họ tên</th>
                      <th>Username</th>
                      <th>Email</th>
                      <th>Địa chỉ</th>
                      <th>Số điện thoại</th>
                      <th style={{ textAlign: "center", width: "160px" }}>Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredUsers.map((u) => (
                      <tr key={u.id}>
                        <td style={{ textAlign: "center" }}>
                          <span className="user-id">#{u.id}</span>
                        </td>
                        <td>
                          <div className="user-name-wrapper">
                            <div className="user-avatar">
                              {(u.name || "U").charAt(0)}
                            </div>
                            <div>
                              <div className="user-name">{u.name}</div>
                            </div>
                          </div>
                        </td>
                        <td>
                          <span className="user-username">@{u.username}</span>
                        </td>
                        <td>
                          <div className="user-email">
                            <i className="far fa-envelope" style={{ fontSize: "0.8rem", color: "#64748b" }}></i>
                            <span>{u.email || "—"}</span>
                          </div>
                        </td>
                        <td>
                          <div className="user-address">
                            {u.address ? (
                              [u.address.street, u.address.suite, u.address.city]
                                .filter(Boolean)
                                .join(", ") || "—"
                            ) : "—"}
                          </div>
                        </td>
                        <td>
                          <span className="user-phone">{u.phone || "—"}</span>
                        </td>
                        <td>
                          <div className="action-buttons" style={{ justifyContent: "center" }}>
                            <button
                              className="btn-edit"
                              onClick={() => editUser(u)}
                              title="Chỉnh sửa thông tin"
                            >
                              <i className="fas fa-pen"></i> Sửa
                            </button>
                            <button
                              className="btn-delete"
                              onClick={() => setDeleteConfirmId(u.id)}
                              title="Xóa người dùng"
                            >
                              <i className="fas fa-trash"></i> Xóa
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* EDIT MODAL */}
          {editing && (
            <div className="modal-overlay" onClick={() => setEditing(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="modal-title">
                    <i className="fas fa-user-edit" style={{ color: "#38bdf8" }}></i>
                    Chỉnh sửa người dùng #{editing.id}
                  </h3>
                  <button
                    className="modal-close"
                    onClick={() => setEditing(null)}
                    aria-label="Đóng"
                  >
                    <i className="fas fa-times"></i>
                  </button>
                </div>

                <form onSubmit={saveUser}>
                  <div className="modal-body">
                    <div className="form-grid">
                      <div className="form-group">
                        <label className="form-label" htmlFor="edit-name">
                          Họ và tên <span className="req">*</span>
                        </label>
                        <input
                          id="edit-name"
                          className="form-input"
                          type="text"
                          required
                          value={editing.name || ""}
                          onChange={(e) => handleEditChange("name", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="edit-username">
                          Username <span className="req">*</span>
                        </label>
                        <input
                          id="edit-username"
                          className="form-input"
                          type="text"
                          required
                          value={editing.username || ""}
                          onChange={(e) => handleEditChange("username", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="edit-email">Email</label>
                        <input
                          id="edit-email"
                          className="form-input"
                          type="email"
                          value={editing.email || ""}
                          onChange={(e) => handleEditChange("email", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="edit-phone">Số điện thoại</label>
                        <input
                          id="edit-phone"
                          className="form-input"
                          type="text"
                          value={editing.phone || ""}
                          onChange={(e) => handleEditChange("phone", e.target.value)}
                        />
                      </div>

                      <div className="form-section-title">
                        <i className="fas fa-map-marker-alt" style={{ marginRight: "6px" }}></i>
                        Thông tin Địa chỉ (Lồng nhau)
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="edit-street">Đường phố</label>
                        <input
                          id="edit-street"
                          className="form-input"
                          type="text"
                          value={(editing.address && editing.address.street) || ""}
                          onChange={(e) => handleEditChange("street", e.target.value)}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="edit-suite">Căn hộ / Phòng</label>
                        <input
                          id="edit-suite"
                          className="form-input"
                          type="text"
                          value={(editing.address && editing.address.suite) || ""}
                          onChange={(e) => handleEditChange("suite", e.target.value)}
                        />
                      </div>

                      <div className="form-group full-width">
                        <label className="form-label" htmlFor="edit-city">Thành phố</label>
                        <input
                          id="edit-city"
                          className="form-input"
                          type="text"
                          value={(editing.address && editing.address.city) || ""}
                          onChange={(e) => handleEditChange("city", e.target.value)}
                        />
                      </div>
                    </div>
                  </div>

                  <div className="modal-footer">
                    <button
                      type="button"
                      className="btn btn-secondary"
                      onClick={() => setEditing(null)}
                    >
                      Hủy bỏ
                    </button>
                    <button type="submit" className="btn btn-primary">
                      <i className="fas fa-save"></i> Cập nhật thay đổi
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CONFIRM DELETE MODAL */}
          {deleteConfirmId && (
            <div className="modal-overlay" onClick={() => setDeleteConfirmId(null)}>
              <div className="modal-content" style={{ maxWidth: "420px" }} onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="modal-title" style={{ color: "#ef4444" }}>
                    <i className="fas fa-exclamation-triangle"></i>
                    Xác nhận xóa
                  </h3>
                  <button className="modal-close" onClick={() => setDeleteConfirmId(null)}>
                    <i className="fas fa-times"></i>
                  </button>
                </div>
                <div className="modal-body">
                  <p style={{ color: "var(--text)" }}>
                    Bạn có chắc chắn muốn xóa người dùng #{deleteConfirmId} không? Hành động này sẽ loại bỏ người dùng khỏi bảng hiển thị.
                  </p>
                </div>
                <div className="modal-footer">
                  <button className="btn btn-secondary" onClick={() => setDeleteConfirmId(null)}>
                    Hủy bỏ
                  </button>
                  <button className="btn btn-danger" onClick={() => removeUser(deleteConfirmId)}>
                    <i className="fas fa-trash-alt"></i> Xóa ngay
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // COMPONENT CHÍNH: App
    // Quản lý State tập trung (State Lifting)
    // ==========================================
    function App() {
      // 1. Khai báo state tập trung
      const [kw, setKeyword] = React.useState("");
      const [newUser, setNewUser] = React.useState(null);

      // Toast feedback
      const [toasts, setToasts] = React.useState([]);

      const showToast = (message, type = "info") => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, message, type }]);
      };

      const removeToast = (id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", minHeight: "100vh" }}>
          {/* Header Navigation */}
          <header className="navbar">
            <div className="navbar-inner">
              <a href="../index.html" className="brand">
                <div className="brand-icon">
                  <i className="fab fa-react"></i>
                </div>
                <div className="brand-text">
                  React <span>CRUD</span>
                </div>
              </a>

              <nav className="nav-actions">
                <a href="report.html" className="nav-link highlight">
                  <i className="fas fa-file-alt"></i>
                  <span>Xem Báo Cáo</span>
                </a>
                <a href="../index.html" className="nav-link">
                  <i className="fas fa-home"></i>
                  <span>Trang chủ</span>
                </a>
                <a
                  href="https://github.com/NamHaiIT2HUST/HaiNDN235321_20261_CNWeb"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="nav-link"
                >
                  <i className="fab fa-github"></i>
                  <span>GitHub</span>
                </a>
              </nav>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="container">
            <div className="page-header">
              <h1 className="page-title">
                Quản lý người dùng
                <span className="badge-react">
                  <i className="fab fa-react"></i> React 18 CRUD
                </span>
              </h1>
              <p className="page-subtitle">
                Ứng dụng thực hành State Lifting, One-way Data Flow, Controlled Components và Hooks (useState, useEffect).
              </p>
            </div>

            {/* Top Control Bar: SearchForm & AddUser */}
            <div className="control-bar">
              <SearchForm onChangeValue={setKeyword} />
              <AddUser onAdd={setNewUser} />
            </div>

            {/* Result Table: Hiển thị, lọc, sửa, xóa */}
            <ResultTable
              keyword={kw}
              user={newUser}
              onAdded={() => setNewUser(null)}
              onNotify={showToast}
            />
          </main>

          {/* Toast Notification Container */}
          <div className="toast-container">
            {toasts.map((toast) => (
              <Toast key={toast.id} toast={toast} onClose={removeToast} />
            ))}
          </div>

          {/* Footer */}
          <footer className="app-footer">
            <p>
              Bài tập React CRUD · Sinh viên: <strong>Nguyễn Đào Nam Hải</strong> (MSSV: 235321) · 
              Môn học: Công nghệ Web và dịch vụ trực tuyến (20261) · 
              Tên miền: <a href="https://namhai23905.id.vn">namhai23905.id.vn</a>
            </p>
          </footer>
        </div>
      );
    }

    // ==========================================
    // RENDER ỨNG DỤNG BẰNG REACTDOM 18
    // ==========================================
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

  </script>
</body>
